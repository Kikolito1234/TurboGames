<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Royal Turbo Games</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

/* ===== ROYAL SWEDEN BACKGROUND ===== */
body {
    font-family: "Poppins", sans-serif;
    margin: 0;
    color: white;

    background:
        linear-gradient(rgba(5,10,30,0.85), rgba(5,10,30,0.95)),
        url("https://upload.wikimedia.org/wikipedia/commons/7/7c/Stockholm_Palace_%28Stockholms_slott%29.jpg");

    background-size: cover;
    background-position: center;
    background-attachment: fixed;
}

/* ===== NAVBAR ===== */
.navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;

    padding: 18px 40px;

    background: rgba(0,0,40,0.6);
    backdrop-filter: blur(20px);

    border-bottom: 1px solid rgba(255,215,0,0.3);
}

.navbar h2 {
    margin: 0;
    font-weight: 600;
}

.navbar span {
    color: #ffd700;
}

/* ===== BANNER ===== */
.banner {
    margin: 40px auto;
    width: 90%;
    max-width: 1100px;
    padding: 60px 20px;
    text-align: center;

    border-radius: 30px;

    background:
        linear-gradient(135deg, rgba(0,51,153,0.6), rgba(0,0,50,0.6));

    backdrop-filter: blur(25px);

    border: 1px solid rgba(255,215,0,0.3);

    box-shadow:
        0 20px 60px rgba(0,0,0,0.7),
        inset 0 0 30px rgba(255,215,0,0.15);
}

.banner h1 {
    font-size: 3.5rem;
    margin: 0;

    color: #fff;

    text-shadow:
        0 0 20px rgba(255,215,0,0.6),
        0 0 40px rgba(255,215,0,0.3);
}

/* ===== GRID ===== */
.game-container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 30px;

    width: 90%;
    max-width: 1100px;
    margin: auto;
}

/* ===== CARD ===== */
.game-button {
    position: relative;
    padding: 25px;
    border-radius: 20px;
    cursor: pointer;
    text-align: center;

    background: rgba(0,20,80,0.5);
    backdrop-filter: blur(20px);

    border: 1px solid rgba(255,215,0,0.25);

    transition: 0.35s;

    box-shadow: 0 15px 40px rgba(0,0,0,0.6);
}

/* GOLD EDGE */
.game-button::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 20px;

    border: 1px solid transparent;
    background: linear-gradient(120deg, transparent, gold, transparent);
    opacity: 0;
    transition: 0.3s;
}

/* HOVER */
.game-button:hover {
    transform: translateY(-8px) scale(1.03);
    background: rgba(0,30,100,0.7);
}

.game-button:hover::before {
    opacity: 1;
}

/* IMAGE */
.game-button img {
    width: 100px;
    height: 100px;
    border-radius: 16px;
    object-fit: cover;

    border: 2px solid rgba(255,215,0,0.3);

    box-shadow: 0 0 20px rgba(255,215,0,0.2);
}

/* TEXT */
.game-button span {
    display: block;
    margin-top: 12px;
    font-weight: 600;
}

/* ===== FOOTER ===== */
.footer {
    text-align: center;
    margin: 60px 0 20px;
    opacity: 0.7;
    font-size: 0.9rem;
}

</style>
</head>

<body>

<div class="navbar">
    <h2>👑 Royal <span>Turbo Games</span></h2>
</div>

<div class="banner">
    <h1>Royal Game Library</h1>
</div>

<div class="game-container" id="game-container"></div>

<div class="footer">
    Inspired by Swedish Royal Design 🇸🇪
</div>

<script>
const gameData = [
    { name: "Territorial", url: "game1.html", img: "https://play-lh.googleusercontent.com/51Sh28L_ZYYkIHJHSmT4s_w3E8vXdTJlWUtfAxx9W91m090qx0QoN7Zr810V4bNdOoY=s96-rw" },
    { name: "Survev", url: "game2.html", img: "https://img.poki-cdn.com/cdn-cgi/image/quality=78,width=80,height=80,fit=cover,f=auto/df1ee2ef4b121c0e1b5f12992e2edee0.png" },
    { name: "Drive Mad", url: "game3.html", img: "https://monkeymart.org/wp-content/uploads/2023/09/drive-mad.png" },
    { name: "Subway Surfers", url: "game4.html", img: "https://img.poki-cdn.com/cdn-cgi/image/quality=78,width=314,height=314,fit=cover,f=auto/e90cc5d8da6dea10c2dfbbcf60aa6cfa.png" },
    { name: "Jump Only", url: "game5.html", img: "https://img.poki-cdn.com/cdn-cgi/image/quality=78,width=94,height=94,fit=cover,f=auto/b7f84bf890e2fcfaba3c19a49573d8fe.png" },
    { name: "Polytrack", url: "game6.html", img: "https://cdn2.steamgriddb.com/thumb/9442e15eadaf27455b8b4f25dbc1f182.jpg" },
    { name: "Level Devil", url: "game7.html", img: "https://vgmtreasurechest.com/soundtracks/level-devil-2024/0c3d1446c6992c2b88a9498de054688b.jpg" },
];

const container = document.getElementById("game-container");

gameData.forEach(game => {
    const el = document.createElement("div");
    el.className = "game-button";
    el.onclick = () => window.location.href = game.url;

    el.innerHTML = `
        <img src="${game.img}">
        <span>${game.name}</span>
    `;

    container.appendChild(el);
});
</script>

</body>
</html>
